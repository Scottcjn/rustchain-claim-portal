[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rustchain-claim-portal"
version = "0.1.0"
description = "Flask-based GitHub claim portal for RustChain"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "cryptography>=43.0.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
